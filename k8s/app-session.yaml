apiVersion: v1
kind: Service
metadata:
  name: service-b
spec:
  type: NodePort
  ports:
    - port: 8000
      nodePort: 30002 # Porta diferente do Service A
  selector:
    app: service-b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
spec:
  replicas: 2 # Podemos escalar o B com um número diferente do A (Eixo Y)
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
      - name: service-b
        image: service-b-session:latest
        imagePullPolicy: Never
        env:
        - name: REDIS_HOST
          value: "redis-db"
        - name: REDIS_PORT
          value: "6379"
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"